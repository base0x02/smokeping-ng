services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-smokeping}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smokeping}
      POSTGRES_DB: ${POSTGRES_DB:-smokeping}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-smokeping}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    cap_add:
      - NET_RAW
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-smokeping}:${POSTGRES_PASSWORD:-smokeping}@db:5432/${POSTGRES_DB:-smokeping}
      PORT: 4000
    ports:
      - "${APP_PORT:-8080}:4000"

volumes:
  pgdata:
